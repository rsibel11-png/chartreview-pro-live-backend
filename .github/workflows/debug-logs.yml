name: Debug Lambda Logs

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke redactRasterizer directly with minimal PDF
        run: |
          # Minimal 1-page PDF (base64) — tiny valid PDF for testing
          MINI_PDF=""

          PAYLOAD=$(echo "{"pdfBase64":"${MINI_PDF}","pageIndex":0}")

          echo "=== Invoking redactRasterizer ==="
          aws lambda invoke             --function-name chartreview-pro-prod-redactRasterizer             --cli-binary-format raw-in-base64-out             --payload "$PAYLOAD"             --region us-east-1             /tmp/rasterizer_out.json 2>&1
          echo "=== Rasterizer response (first 500 chars) ==="
          cat /tmp/rasterizer_out.json | head -c 500

          echo ""
          echo "=== Check imageBase64 field present ==="
          python3 -c "
import json, sys
with open('/tmp/rasterizer_out.json') as f:
    data = json.load(f)
keys = list(data.keys()) if isinstance(data, dict) else 'not a dict'
print('Keys:', keys)
if 'error' in data: print('ERROR:', data['error'])
if 'errorMessage' in data: print('LAMBDA CRASH:', data['errorMessage'])
if 'imageBase64' in data: print('imageBase64 length:', len(data['imageBase64']))
if 'width' in data: print('dimensions:', data['width'], 'x', data['height'])
" 2>&1

          echo ""
          echo "=== CloudWatch logs — rasterizer (last 30 entries) ==="
          aws logs filter-log-events             --log-group-name /aws/lambda/chartreview-pro-prod-redactRasterizer             --start-time $(( $(date +%s) - 600 ))000             --region us-east-1             --query "events[*].message"             --output text 2>&1 | tail -30

          echo ""
          echo "=== CloudWatch logs — worker (last 30 entries) ==="
          aws logs filter-log-events             --log-group-name /aws/lambda/chartreview-pro-prod-redactDocumentWorker             --start-time $(( $(date +%s) - 600 ))000             --region us-east-1             --query "events[*].message"             --output text 2>&1 | tail -30

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
