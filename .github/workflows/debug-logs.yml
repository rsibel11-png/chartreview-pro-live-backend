name: Debug Lambda Logs

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check API GW integration and invoke Lambda
        run: |
          API_ID="1h4kpspbs6"
          REGION="us-east-1"

          echo '=== API GW resources with /redact ==='
          aws apigateway get-resources --rest-api-id $API_ID --region $REGION \
            --query 'items[?contains(path,`redact`)]' --output json

          echo '=== Get /redact resource ID ==='
          REDACT_ID=$(aws apigateway get-resources --rest-api-id $API_ID --region $REGION \
            --query "items[?contains(path,'redact')].id" --output text)
          echo "Resource ID: $REDACT_ID"

          echo '=== POST integration ==='
          aws apigateway get-integration \
            --rest-api-id $API_ID \
            --resource-id $REDACT_ID \
            --http-method POST \
            --region $REGION 2>&1 || echo 'No POST integration found'

          echo '=== Direct Lambda invoke (simple) ==='
          aws lambda invoke \
            --function-name chartreview-pro-prod-redactDocumentStart \
            --cli-binary-format raw-in-base64-out \
            --payload '{"httpMethod":"POST","path":"/documents/test/redact","pathParameters":{"aws_document_id":"test-id"},"headers":{"x-api-key":"ChartReview#2026$ProdKey!Rx"},"body":null}' \
            --region us-east-1 \
            /tmp/out.json 2>&1
          echo '=== Lambda response ==='
          cat /tmp/out.json 2>/dev/null || echo 'no output'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
