name: Debug Lambda Logs

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch textract_blocks.json page 26 tokens
        run: |
          echo "=== Downloading textract_blocks.json ==="
          aws s3 cp s3://chartreview-documents-prod/orgs/69ceb1ab037acdd4467b31c3/documents/22c3ca24-c101-4484-bb8f-32616eb52b38/textract_blocks.json /tmp/blocks.json 2>&1

          echo ""
          echo "=== Page 26 tokens ==="
          python3 - << 'EOF'
import json
with open('/tmp/blocks.json') as f:
    blocks = json.load(f)
print(f'Total blocks: {len(blocks)}')
p26 = [b for b in blocks if b.get('p') == 26]
print(f'Page 26 blocks: {len(p26)}')
sorted_p26 = sorted(p26, key=lambda b: b['tp'])
print()
print('=== LAST 25 TOKENS (bottom of page) ===')
for b in sorted_p26[-25:]:
    print(f'  y={b["tp"]:.4f} x={b["l"]:.4f} | {repr(b["t"])}')
footer = [b for b in p26 if b.get('tp', 0) > 0.85]
print(f'\n=== FOOTER TOKENS (tp > 0.85): {len(footer)} ===')
for b in sorted(footer, key=lambda b: (b['tp'], b['l'])):
    print(f'  y={b["tp"]:.4f} x={b["l"]:.4f} | {repr(b["t"])}')
EOF

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
