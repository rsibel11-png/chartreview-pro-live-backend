name: Debug Lambda Logs

on:
  workflow_dispatch:

jobs:
  invoke-and-log:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke Lambda and capture error
        run: |
          echo '=== Direct Lambda invocation ==='
          aws lambda invoke \
            --function-name chartreview-pro-prod-redactDocumentStart \
            --invocation-type RequestResponse \
            --payload '{"httpMethod":"POST","pathParameters":{"aws_document_id":"test-123"},"headers":{"x-api-key":"ChartReview#2026$ProdKey!Rx"},"body":null}' \
            --log-type Tail \
            --region us-east-1 \
            --query 'LogResult' \
            --output text \
            /tmp/response.json 2>&1 | base64 -d || true
          echo '=== Response payload ==='
          cat /tmp/response.json 2>/dev/null || echo 'no response file'
          echo '=== CloudWatch logs (last 100 events) ==='
          sleep 3
          LOG_GROUP='/aws/lambda/chartreview-pro-prod-redactDocumentStart'
          STREAM=$(aws logs describe-log-streams \
            --log-group-name "$LOG_GROUP" \
            --order-by LastEventTime --descending --max-items 1 \
            --region us-east-1 \
            --query 'logStreams[0].logStreamName' --output text)
          echo "Stream: $STREAM"
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$STREAM" \
            --limit 100 --region us-east-1 \
            --query 'events[*].message' --output text 2>&1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
