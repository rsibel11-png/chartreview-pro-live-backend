name: Patch CORS Headers

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch x-org-id into all OPTIONS integrations
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set +e
          API_ID="1h4kpspbs6"
          STAGE="prod"
          REGION="us-east-1"
          PATCH_OP='[{"op":"replace","path":"/responseParameters/method.response.header.Access-Control-Allow-Headers","value":"'"'"'Content-Type,X-Amz-Date,Authorization,X-Api-Key,x-api-key,X-Org-Id,x-org-id,X-Amz-Security-Token'"'"'"}]'

          echo "Fetching resources..."
          RESOURCES=$(aws apigateway get-resources --rest-api-id $API_ID --region $REGION --query 'items[*].id' --output text)
          echo "Resources: $RESOURCES"

          for RID in $RESOURCES; do
            HAS_OPTIONS=$(aws apigateway get-method --rest-api-id $API_ID --resource-id $RID --http-method OPTIONS --region $REGION 2>&1)
            if echo "$HAS_OPTIONS" | grep -q "httpMethod"; then
              echo "Patching $RID..."
              aws apigateway update-integration-response \
                --rest-api-id $API_ID \
                --resource-id $RID \
                --http-method OPTIONS \
                --status-code 200 \
                --region $REGION \
                --patch-operations "$PATCH_OP"
              RC=$?
              if [ $RC -eq 0 ]; then
                echo "  Done $RID"
              else
                echo "  Skipped $RID (rc=$RC)"
              fi
            fi
          done

          echo "Deploying stage..."
          aws apigateway create-deployment --rest-api-id $API_ID --stage-name $STAGE --region $REGION
          echo "All done!"
          exit 0

      - name: Verify patch
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          set +e
          echo "=== Verifying all OPTIONS resources ==="
          RESOURCES=$(aws apigateway get-resources --rest-api-id 1h4kpspbs6 --region us-east-1 --query 'items[*].id' --output text)
          for RID in $RESOURCES; do
            HAS_OPTIONS=$(aws apigateway get-method --rest-api-id 1h4kpspbs6 --resource-id $RID --http-method OPTIONS --region us-east-1 2>&1)
            if echo "$HAS_OPTIONS" | grep -q "httpMethod"; then
              HEADERS=$(aws apigateway get-integration-response --rest-api-id 1h4kpspbs6 --resource-id $RID --http-method OPTIONS --status-code 200 --region us-east-1 --query 'responseParameters."method.response.header.Access-Control-Allow-Headers"' --output text 2>&1)
              echo "$RID: $HEADERS"
            fi
          done
