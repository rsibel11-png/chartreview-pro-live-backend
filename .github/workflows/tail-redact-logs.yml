name: Tail Redact Worker Logs

on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch last 90 min of redactDocumentWorker logs
        run: |
          START=$(( $(date +%s) - 5400 ))000
          aws logs filter-log-events \
            --log-group-name /aws/lambda/chartreview-pro-prod-redactDocumentWorker \
            --start-time $START \
            --query "events[*].message" \
            --output text \
            --region us-east-1 2>&1 | tail -200
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
