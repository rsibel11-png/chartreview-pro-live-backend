name: Tail Redact Worker Logs

on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - name: Dump redactCaseWorker logs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          START=$(( $(date +%s) - 7200 ))000
          aws logs filter-log-events \
            --log-group-name /aws/lambda/chartreview-pro-prod-redactCaseWorker \
            --start-time $START \
            --query "events[*].message" \
            --output json > /tmp/cw_logs.json 2>&1 || true
          wc -c /tmp/cw_logs.json
          cat /tmp/cw_logs.json | tr ',' '\n' | grep -v '^\[' | grep -v '^\]' | sed 's/^"//;s/"$//' | sed 's/\\n/\n/g' | tail -300
