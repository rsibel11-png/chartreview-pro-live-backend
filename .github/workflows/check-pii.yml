name: Check PII Resource

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect /folders/{folderName}/pii methods
        run: |
          echo "=== Methods on uivykb ==="
          for METHOD in GET OPTIONS; do
            echo "--- $METHOD ---"
            aws apigateway get-method \
              --rest-api-id 1h4kpspbs6 --resource-id uivykb \
              --http-method $METHOD --region us-east-1 2>&1 || echo "No $METHOD method"

            echo "-- integration --"
            aws apigateway get-integration \
              --rest-api-id 1h4kpspbs6 --resource-id uivykb \
              --http-method $METHOD --region us-east-1 2>&1 || echo "No integration for $METHOD"

            echo "-- method response --"
            aws apigateway get-method-response \
              --rest-api-id 1h4kpspbs6 --resource-id uivykb \
              --http-method $METHOD --status-code 200 --region us-east-1 2>&1 || echo "No method response for $METHOD"

            echo "-- integration response --"
            aws apigateway get-integration-response \
              --rest-api-id 1h4kpspbs6 --resource-id uivykb \
              --http-method $METHOD --status-code 200 --region us-east-1 2>&1 || echo "No integration response for $METHOD"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
