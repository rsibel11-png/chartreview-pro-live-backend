name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chartreview-aws

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Package Lambda functions
        run: |
          rm -rf node_modules/@nodable
          zip -r function.zip src/ node_modules/ package.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Build rasterizer Lambda layer (pdfjs-dist + canvas)
        run: |
          mkdir -p rasterizer-layer/nodejs
          cd rasterizer-layer/nodejs
          npm init -y
          npm install pdfjs-dist canvas --save
          cd ../..
          zip -r rasterizer-layer.zip rasterizer-layer/
          echo "Rasterizer layer zip size: $(du -sh rasterizer-layer.zip | cut -f1)"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Upload rasterizer layer to S3
        run: |
          aws s3 cp rasterizer-layer.zip s3://chartreview-documents-prod/layers/rasterizer-layer.zip
          echo "Layer uploaded to S3"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Publish rasterizer Lambda layer version
        run: |
          LAYER_ARN=$(aws lambda publish-layer-version \
            --layer-name chartreview-rasterizer-layer \
            --description "pdfjs-dist + canvas for PDF page rasterization" \
            --compatible-runtimes nodejs20.x \
            --content S3Bucket=chartreview-documents-prod,S3Key=layers/rasterizer-layer.zip \
            --region us-east-1 \
            --query 'LayerVersionArn' --output text)
          echo "Layer ARN: $LAYER_ARN"
          echo "RASTERIZER_LAYER_ARN=$LAYER_ARN" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Create classifyJobWorker Lambda if missing
        run: |
          aws lambda get-function --function-name chartreview-pro-prod-classifyJobWorker --region us-east-1 2>/dev/null || \
          aws lambda create-function \
            --function-name chartreview-pro-prod-classifyJobWorker \
            --runtime nodejs20.x \
            --role arn:aws:iam::531948420933:role/chartreview-pro-prod-us-east-1-lambdaRole \
            --handler src/handlers/documents_new.classifyJobWorker \
            --timeout 600 \
            --memory-size 1024 \
            --zip-file fileb://function.zip \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Create generateSummaryStart Lambda if missing
        run: |
          aws lambda get-function --function-name chartreview-pro-prod-generateSummaryStart --region us-east-1 2>/dev/null || \
          aws lambda create-function \
            --function-name chartreview-pro-prod-generateSummaryStart \
            --runtime nodejs20.x \
            --role arn:aws:iam::531948420933:role/chartreview-pro-prod-us-east-1-lambdaRole \
            --handler src/handlers/generate_summary.generateSummaryStart \
            --timeout 29 \
            --memory-size 512 \
            --zip-file fileb://function.zip \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Create generateSummaryWorker Lambda if missing
        run: |
          aws lambda get-function --function-name chartreview-pro-prod-generateSummaryWorker --region us-east-1 2>/dev/null || \
          aws lambda create-function \
            --function-name chartreview-pro-prod-generateSummaryWorker \
            --runtime nodejs20.x \
            --role arn:aws:iam::531948420933:role/chartreview-pro-prod-us-east-1-lambdaRole \
            --handler src/handlers/generate_summary.generateSummaryWorker \
            --timeout 900 \
            --memory-size 1024 \
            --zip-file fileb://function.zip \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Create generateSummaryChunkWorker Lambda if missing
        run: |
          aws lambda get-function --function-name chartreview-pro-prod-generateSummaryChunkWorker --region us-east-1 2>/dev/null || \
          aws lambda create-function \
            --function-name chartreview-pro-prod-generateSummaryChunkWorker \
            --runtime nodejs20.x \
            --role arn:aws:iam::531948420933:role/chartreview-pro-prod-us-east-1-lambdaRole \
            --handler src/handlers/generate_summary.generateSummaryChunkWorker \
            --timeout 900 \
            --memory-size 1024 \
            --zip-file fileb://function.zip \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Create buildVisitIndexStart Lambda if missing
        run: |
          aws lambda get-function --function-name chartreview-pro-prod-buildVisitIndexStart --region us-east-1 2>/dev/null || \
          aws lambda create-function \
            --function-name chartreview-pro-prod-buildVisitIndexStart \
            --runtime nodejs20.x \
            --role arn:aws:iam::531948420933:role/chartreview-pro-prod-us-east-1-lambdaRole \
            --handler src/handlers/generate_summary.buildVisitIndexStart \
            --timeout 29 \
            --memory-size 512 \
            --zip-file fileb://function.zip \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Create buildVisitIndexWorker Lambda if missing
        run: |
          aws lambda get-function --function-name chartreview-pro-prod-buildVisitIndexWorker --region us-east-1 2>/dev/null || \
          aws lambda create-function \
            --function-name chartreview-pro-prod-buildVisitIndexWorker \
            --runtime nodejs20.x \
            --role arn:aws:iam::531948420933:role/chartreview-pro-prod-us-east-1-lambdaRole \
            --handler src/handlers/generate_summary.buildVisitIndexWorker \
            --timeout 900 \
            --memory-size 1024 \
            --zip-file fileb://function.zip \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Create verifySummaryWorker Lambda if not exists
        run: |
          aws lambda get-function --function-name chartreview-pro-prod-verifySummaryWorker --region us-east-1 2>/dev/null || \
          aws lambda create-function \
            --function-name chartreview-pro-prod-verifySummaryWorker \
            --runtime nodejs20.x \
            --role arn:aws:iam::531948420933:role/chartreview-pro-prod-us-east-1-lambdaRole \
            --handler src/handlers/generate_summary.verifySummaryWorker \
            --timeout 900 \
            --memory-size 1024 \
            --zip-file fileb://function.zip \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1


      - name: Create redactDocumentStart Lambda if missing
        run: |
          aws lambda get-function --function-name chartreview-pro-prod-redactDocumentStart --region us-east-1 2>/dev/null || \
          aws lambda create-function \
            --function-name chartreview-pro-prod-redactDocumentStart \
            --runtime nodejs20.x \
            --role arn:aws:iam::531948420933:role/chartreview-pro-prod-us-east-1-lambdaRole \
            --handler src/handlers/redact_document.redactDocumentStart \
            --timeout 29 \
            --memory-size 512 \
            --environment "Variables={S3_BUCKET=chartreview-documents-prod,DOCUMENTS_TABLE=chartreview-documents-prod,JOBS_TABLE=chartreview-jobs-prod,REDACT_WORKER_FUNCTION_NAME=chartreview-pro-prod-redactDocumentWorker,MODEL_ID=us.anthropic.claude-sonnet-4-6}" \
            --zip-file fileb://function.zip \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Create redactDocumentWorker Lambda if missing
        run: |
          aws lambda get-function --function-name chartreview-pro-prod-redactDocumentWorker --region us-east-1 2>/dev/null || \
          aws lambda create-function \
            --function-name chartreview-pro-prod-redactDocumentWorker \
            --runtime nodejs20.x \
            --role arn:aws:iam::531948420933:role/chartreview-pro-prod-us-east-1-lambdaRole \
            --handler src/handlers/redact_document.redactDocumentWorker \
            --timeout 900 \
            --memory-size 1024 \
            --environment "Variables={S3_BUCKET=chartreview-documents-prod,DOCUMENTS_TABLE=chartreview-documents-prod,JOBS_TABLE=chartreview-jobs-prod,MODEL_ID=us.anthropic.claude-sonnet-4-6,REDACT_RASTERIZER_FUNCTION_NAME=chartreview-pro-prod-redactRasterizer}" \
            --zip-file fileb://function.zip \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Create redactRasterizer Lambda if missing
        run: |
          aws lambda get-function --function-name chartreview-pro-prod-redactRasterizer --region us-east-1 2>/dev/null || \
          aws lambda create-function \
            --function-name chartreview-pro-prod-redactRasterizer \
            --runtime nodejs20.x \
            --role arn:aws:iam::531948420933:role/chartreview-pro-prod-us-east-1-lambdaRole \
            --handler src/handlers/redact_rasterizer.handler \
            --timeout 60 \
            --memory-size 2048 \
            --layers "$RASTERIZER_LAYER_ARN" \
            --environment "Variables={NODE_PATH=/opt/nodejs/node_modules}" \
            --zip-file fileb://function.zip \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Update redactRasterizer with latest layer
        run: |
          aws lambda update-function-configuration \
            --function-name chartreview-pro-prod-redactRasterizer \
            --layers "$RASTERIZER_LAYER_ARN" \
            --region us-east-1
          aws lambda wait function-updated --function-name chartreview-pro-prod-redactRasterizer --region us-east-1
          aws lambda update-function-code \
            --function-name chartreview-pro-prod-redactRasterizer \
            --zip-file fileb://function.zip \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Wire /documents/{id}/redact route in API Gateway
        run: |
          API_ID="1h4kpspbs6"
          REGION="us-east-1"
          ACCOUNT="531948420933"
          STAGE="prod"
          LAMBDA_ARN="arn:aws:lambda:${REGION}:${ACCOUNT}:function:chartreview-pro-prod-redactDocumentStart"

          DOCS_RESOURCE=$(aws apigateway get-resources --rest-api-id $API_ID --region $REGION \
            --query "items[?path=='/documents/{aws_document_id}'].id" --output text)
          echo "Parent resource: $DOCS_RESOURCE"

          REDACT_RESOURCE=$(aws apigateway get-resources --rest-api-id $API_ID --region $REGION \
            --query "items[?path=='/documents/{aws_document_id}/redact'].id" --output text)

          if [ -z "$REDACT_RESOURCE" ]; then
            REDACT_RESOURCE=$(aws apigateway create-resource \
              --rest-api-id $API_ID --parent-id $DOCS_RESOURCE \
              --path-part redact --region $REGION --query 'id' --output text)
            echo "Created /redact resource: $REDACT_RESOURCE"
          else
            echo "/redact already exists: $REDACT_RESOURCE"
          fi

          aws apigateway put-method --rest-api-id $API_ID --resource-id $REDACT_RESOURCE \
            --http-method POST --authorization-type NONE --region $REGION 2>/dev/null || true

          aws apigateway put-integration --rest-api-id $API_ID --resource-id $REDACT_RESOURCE \
            --http-method POST --type AWS_PROXY --integration-http-method POST \
            --uri "arn:aws:apigateway:${REGION}:lambda:path/2015-03-31/functions/${LAMBDA_ARN}/invocations" \
            --region $REGION

          aws lambda add-permission \
            --function-name chartreview-pro-prod-redactDocumentStart \
            --statement-id apigateway-redact-$(date +%s) \
            --action lambda:InvokeFunction \
            --principal apigateway.amazonaws.com \
            --source-arn "arn:aws:execute-api:${REGION}:${ACCOUNT}:${API_ID}/*" \
            --region $REGION 2>/dev/null || true

          aws apigateway put-method --rest-api-id $API_ID --resource-id $REDACT_RESOURCE \
            --http-method OPTIONS --authorization-type NONE --region $REGION 2>/dev/null || true

          aws apigateway put-integration --rest-api-id $API_ID --resource-id $REDACT_RESOURCE \
            --http-method OPTIONS --type MOCK \
            --request-templates '{"application/json":"{\"statusCode\":200}"}' --region $REGION

          aws apigateway put-method-response --rest-api-id $API_ID --resource-id $REDACT_RESOURCE \
            --http-method OPTIONS --status-code 200 \
            --response-parameters '{"method.response.header.Access-Control-Allow-Headers":false,"method.response.header.Access-Control-Allow-Methods":false,"method.response.header.Access-Control-Allow-Origin":false}' \
            --region $REGION 2>/dev/null || true

          aws apigateway put-integration-response --rest-api-id $API_ID --resource-id $REDACT_RESOURCE \
            --http-method OPTIONS --status-code 200 \
            --response-parameters '{"method.response.header.Access-Control-Allow-Headers":"'\''Content-Type,Authorization,x-api-key,x-org-id'\''","method.response.header.Access-Control-Allow-Methods":"'\''POST,OPTIONS'\''","method.response.header.Access-Control-Allow-Origin":"'\''*'\''"}' \
            --region $REGION 2>/dev/null || true

          aws apigateway create-deployment --rest-api-id $API_ID --stage-name $STAGE --region $REGION
          echo "Done — /documents/{aws_document_id}/redact is live"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Build and upload zips to S3
        working-directory: chartreview-aws
        run: |
          TS=$(date +%Y%m%d%H%M%S)

          # Main zip: remove heavy redact-only packages to stay under 250MB unzipped
          cp function.zip function_main.zip
          zip -d function_main.zip "node_modules/sharp/*" "node_modules/pdfjs-dist/*" "node_modules/jsdom/*" "node_modules/canvas/*" 2>/dev/null || true
          MAIN_KEY="lambda-deploys/function-main-${TS}.zip"
          aws s3 cp function_main.zip s3://chartreview-documents-prod/$MAIN_KEY --region us-east-1
          echo "MAIN_KEY=$MAIN_KEY" >> $GITHUB_ENV

          # Redact zip: full zip including sharp/pdfjs-dist/jsdom
          REDACT_KEY="lambda-deploys/function-redact-${TS}.zip"
          aws s3 cp function.zip s3://chartreview-documents-prod/$REDACT_KEY --region us-east-1
          echo "REDACT_KEY=$REDACT_KEY" >> $GITHUB_ENV
          echo "Main zip: $MAIN_KEY | Redact zip: $REDACT_KEY"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Diagnostic — invoke redactRasterizer and check response
        run: |
          MINI_PDF=""
          echo "=== Lambda config ==="
          aws lambda get-function-configuration \
            --function-name chartreview-pro-prod-redactRasterizer \
            --region us-east-1 \
            --query "{handler:Handler,memory:MemorySize,layers:Layers[*].Arn}" \
            --output json
          echo "=== Direct invoke ==="
          aws lambda invoke \
            --function-name chartreview-pro-prod-redactRasterizer \
            --cli-binary-format raw-in-base64-out \
            --payload "{\"pdfBase64\":\"${MINI_PDF}\",\"pageIndex\":0}" \
            --region us-east-1 \
            /tmp/out.json 2>&1
          echo "=== Response ==="
          python3 -c "
import json
with open('/tmp/out.json') as f: d = json.load(f)
keys = list(d.keys()) if isinstance(d,dict) else str(type(d))
print('Keys:', keys)
if isinstance(d,dict):
  for k in ['error','errorMessage','errorType']: 
    if k in d: print(k+':',d[k])
  if 'imageBase64' in d: print('imageBase64 len:', len(d['imageBase64']))
  if 'width' in d: print('dims:', d['width'],'x',d['height'])
" 2>&1 || cat /tmp/out.json | head -c 300
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Deploy all Lambda functions directly
        run: |
          FUNCTIONS=(
            "chartreview-pro-prod-listPatients"
            "chartreview-pro-prod-createPatient"
            "chartreview-pro-prod-getPatient"
            "chartreview-pro-prod-updatePatient"
            "chartreview-pro-prod-deletePatient"
            "chartreview-pro-prod-listPatientDocuments"
            "chartreview-pro-prod-getUploadUrl"
            "chartreview-pro-prod-directUpload"
            "chartreview-pro-prod-listAllDocuments"
            "chartreview-pro-prod-getDocument"
            "chartreview-pro-prod-updateDocument"
            "chartreview-pro-prod-deleteDocument"
            "chartreview-pro-prod-getDownloadUrl"
            "chartreview-pro-prod-getDocumentText"
            "chartreview-pro-prod-getDocumentFullText"
            "chartreview-pro-prod-processDocument"
            "chartreview-pro-prod-processWorker"
            "chartreview-pro-prod-assessRelevance"
            "chartreview-pro-prod-reassessDocument"
            "chartreview-pro-prod-classifyStart"
            "chartreview-pro-prod-classifyJobWorker"
            "chartreview-pro-prod-getJob"
            "chartreview-pro-prod-listAllSummaries"
            "chartreview-pro-prod-createSummary"
            "chartreview-pro-prod-getSummary"
            "chartreview-pro-prod-updateSummary"
            "chartreview-pro-prod-deleteSummary"
            "chartreview-pro-prod-generateSummaryStart"
            "chartreview-pro-prod-generateSummaryWorker"
            "chartreview-pro-prod-generateSummaryChunkWorker"
            "chartreview-pro-prod-buildVisitIndexStart"
            "chartreview-pro-prod-buildVisitIndexWorker"
            "chartreview-pro-prod-verifySummaryWorker"
            "chartreview-pro-prod-redactDocumentStart"
            "chartreview-pro-prod-redactDocumentWorker"
          )
          for FUNC in "${FUNCTIONS[@]}"; do
            echo "Updating $FUNC..."
            aws lambda update-function-code \
              --function-name "$FUNC" \
              --s3-bucket chartreview-documents-prod \
              --s3-key "$MAIN_KEY" \
              --region us-east-1 || echo "WARNING: $FUNC not found, skipping"
          done

          # Redact functions use the full zip (includes sharp/pdfjs-dist/jsdom)
          for FUNC in "chartreview-pro-prod-redactDocumentStart" "chartreview-pro-prod-redactDocumentWorker"; do
            echo "Updating redact function $FUNC with redact zip..."
            aws lambda update-function-code \
              --function-name "$FUNC" \
              --s3-bucket chartreview-documents-prod \
              --s3-key "$REDACT_KEY" \
              --region us-east-1 || echo "WARNING: $FUNC not found, skipping"
          done
          echo "All Lambda functions updated!"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
