name: Deploy Backend to AWS Lambda

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chartreview-aws

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Package Lambda functions
        run: |
          zip -r function.zip src/ node_modules/ package.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Create classifyJobWorker Lambda if missing
        run: |
          aws lambda get-function --function-name chartreview-pro-prod-classifyJobWorker --region us-east-1 2>/dev/null || \
          aws lambda create-function \
            --function-name chartreview-pro-prod-classifyJobWorker \
            --runtime nodejs20.x \
            --role arn:aws:iam::531948420933:role/chartreview-pro-prod-us-east-1-lambdaRole \
            --handler src/handlers/documents_new.classifyJobWorker \
            --timeout 600 \
            --memory-size 1024 \
            --zip-file fileb://function.zip \
            --region us-east-1
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Deploy all Lambda functions directly
        run: |
          FUNCTIONS=(
            "chartreview-pro-prod-listPatients"
            "chartreview-pro-prod-createPatient"
            "chartreview-pro-prod-getPatient"
            "chartreview-pro-prod-updatePatient"
            "chartreview-pro-prod-deletePatient"
            "chartreview-pro-prod-listPatientDocuments"
            "chartreview-pro-prod-getUploadUrl"
            "chartreview-pro-prod-directUpload"
            "chartreview-pro-prod-listAllDocuments"
            "chartreview-pro-prod-getDocument"
            "chartreview-pro-prod-updateDocument"
            "chartreview-pro-prod-deleteDocument"
            "chartreview-pro-prod-getDownloadUrl"
            "chartreview-pro-prod-getDocumentText"
            "chartreview-pro-prod-getDocumentFullText"
            "chartreview-pro-prod-processDocument"
            "chartreview-pro-prod-processWorker"
            "chartreview-pro-prod-assessRelevance"
            "chartreview-pro-prod-reassessDocument"
            "chartreview-pro-prod-classifyStart"
            "chartreview-pro-prod-classifyJobWorker"
            "chartreview-pro-prod-getJob"
            "chartreview-pro-prod-listAllSummaries"
            "chartreview-pro-prod-createSummary"
            "chartreview-pro-prod-getSummary"
            "chartreview-pro-prod-updateSummary"
            "chartreview-pro-prod-deleteSummary"
          )
          for FUNC in "${FUNCTIONS[@]}"; do
            echo "Updating $FUNC..."
            aws lambda update-function-code \
              --function-name "$FUNC" \
              --zip-file fileb://function.zip \
              --region us-east-1 || echo "WARNING: $FUNC not found, skipping"
          done
          echo "All Lambda functions updated!"

          # Also update env vars on key functions to ensure correct bucket
          echo "Patching S3_BUCKET env vars..."
          ENV_FUNCS=(
            "chartreview-pro-prod-getDownloadUrl"
            "chartreview-pro-prod-listAllDocuments"
            "chartreview-pro-prod-processDocument"
            "chartreview-pro-prod-processWorker"
            "chartreview-pro-prod-assessRelevance"
            "chartreview-pro-prod-classifyStart"
            "chartreview-pro-prod-classifyJobWorker"
            "chartreview-pro-prod-deleteDocument"
            "chartreview-pro-prod-updateDocument"
          )
          for FUNC in "${ENV_FUNCS[@]}"; do
            CONFIG=$(aws lambda get-function-configuration --function-name "$FUNC" --region us-east-1 2>/dev/null) || continue
            # Build updated env JSON using python3
            UPDATED=$(echo "$CONFIG" | python3 -c "
import sys, json
cfg = json.load(sys.stdin)
env = cfg.get('Environment', {}).get('Variables', {})
env['S3_BUCKET'] = 'chartreview-documents-prod'
env['DOCUMENTS_BUCKET'] = 'chartreview-documents-prod'
print(json.dumps({'Variables': env}))
")
            aws lambda update-function-configuration --function-name "$FUNC" --environment "$UPDATED" --region us-east-1 > /dev/null && echo "  Env updated: $FUNC"
          done
          echo "Env var patch complete!"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
