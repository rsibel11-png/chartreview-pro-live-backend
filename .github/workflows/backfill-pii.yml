name: Backfill Folder PII

on:
  workflow_dispatch:
    inputs:
      org_id:
        description: 'Org ID'
        required: true
        default: '69ceb1ab037acdd4467b31c3'
      folder:
        description: 'Folder name (exact, including leading space if any)'
        required: true
        default: ' JonesMoore'

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chartreview-aws
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci --omit=dev
      - name: Run backfill
        run: |
          node src/backfill_pii.js
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          ORG_ID: ${{ github.event.inputs.org_id }}
          FOLDER_NAME: ${{ github.event.inputs.folder }}
