name: Fix API Gateway Deploy

on:
  workflow_dispatch:

jobs:
  fix-apigw:
    runs-on: ubuntu-latest
    steps:
      - name: Recreate folder-pii table with correct key + deploy
        run: |
          REGION=us-east-1
          API_ID=1h4kpspbs6
          STAGE=prod

          echo "=== Delete wrong table (folder_key) and recreate with org_folder ==="
          aws dynamodb delete-table --table-name chartreview-folder-pii-prod --region $REGION 2>/dev/null || true
          sleep 5

          aws dynamodb create-table \
            --table-name chartreview-folder-pii-prod \
            --attribute-definitions AttributeName=org_folder,AttributeType=S \
            --key-schema AttributeName=org_folder,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region $REGION

          echo "Waiting for table to become ACTIVE..."
          aws dynamodb wait table-exists --table-name chartreview-folder-pii-prod --region $REGION
          echo "Table ready."

          echo "=== Deploy API GW stage ==="
          aws apigateway create-deployment --rest-api-id $API_ID --stage-name $STAGE --region $REGION
          echo "Done."
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
