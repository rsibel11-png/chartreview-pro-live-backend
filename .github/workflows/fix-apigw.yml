name: Fix API Gateway Deploy

on:
  workflow_dispatch:

jobs:
  fix-apigw:
    runs-on: ubuntu-latest
    steps:
      - name: Wire OPTIONS CORS + deploy
        run: |
          API=1h4kpspbs6
          RES=uivykb
          REGION=us-east-1
          STAGE=prod

          echo "=== 2. MOCK integration ==="
          TEMPLATE=$(printf '%s' '{"application/json":"{\"statusCode\":200}"}')
          aws apigateway put-integration \
            --rest-api-id $API --resource-id $RES \
            --http-method OPTIONS --type MOCK \
            --request-templates "$TEMPLATE" \
            --region $REGION

          echo "=== 3. Method response ==="
          aws apigateway put-method-response \
            --rest-api-id $API --resource-id $RES \
            --http-method OPTIONS --status-code 200 \
            --response-parameters '{"method.response.header.Access-Control-Allow-Headers":false,"method.response.header.Access-Control-Allow-Methods":false,"method.response.header.Access-Control-Allow-Origin":false}' \
            --region $REGION

          echo "=== 4. Integration response ==="
          aws apigateway put-integration-response \
            --rest-api-id $API --resource-id $RES \
            --http-method OPTIONS --status-code 200 \
            --response-parameters '{"method.response.header.Access-Control-Allow-Headers":"\x27Content-Type,Authorization,X-Api-Key,x-api-key,X-Org-Id,x-org-id\x27","method.response.header.Access-Control-Allow-Methods":"\x27GET,OPTIONS\x27","method.response.header.Access-Control-Allow-Origin":"\x27*\x27"}' \
            --region $REGION

          echo "=== 5. Deploy ==="
          aws apigateway create-deployment --rest-api-id $API --stage-name $STAGE --region $REGION
          echo "Done."
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
