name: Fix API Gateway Deploy

on:
  workflow_dispatch:

jobs:
  fix-apigw:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chartreview-aws
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --omit=dev
      - run: npm install @aws-sdk/client-api-gateway --no-save
      - name: Wire OPTIONS CORS and deploy
        run: node src/wire_cors.js
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
