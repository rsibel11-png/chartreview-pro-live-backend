name: Fix API Gateway Deploy

on:
  workflow_dispatch:

jobs:
  fix-apigw:
    runs-on: ubuntu-latest
    steps:
      - name: Wire OPTIONS CORS + add method responses + deploy
        run: |
          API=1h4kpspbs6
          RES=uivykb
          REGION=us-east-1
          STAGE=prod

          echo "=== 1. Create OPTIONS method ==="
          aws apigateway put-method \
            --rest-api-id $API --resource-id $RES \
            --http-method OPTIONS --authorization-type NONE \
            --no-api-key-required \
            --region $REGION 2>&1 || echo "OPTIONS method already exists"

          echo "=== 2. Create OPTIONS MOCK integration ==="
          aws apigateway put-integration \
            --rest-api-id $API --resource-id $RES \
            --http-method OPTIONS --type MOCK \
            --request-templates '{"application/json":"{"statusCode":200}"}' \
            --region $REGION

          echo "=== 3. Create OPTIONS method response ==="
          aws apigateway put-method-response \
            --rest-api-id $API --resource-id $RES \
            --http-method OPTIONS --status-code 200 \
            --response-parameters '{
              "method.response.header.Access-Control-Allow-Headers": false,
              "method.response.header.Access-Control-Allow-Methods": false,
              "method.response.header.Access-Control-Allow-Origin": false
            }' \
            --region $REGION

          echo "=== 4. Create OPTIONS integration response with CORS headers ==="
          aws apigateway put-integration-response \
            --rest-api-id $API --resource-id $RES \
            --http-method OPTIONS --status-code 200 \
            --response-parameters '{
              "method.response.header.Access-Control-Allow-Headers": "'"'"'Content-Type,Authorization,X-Amz-Date,X-Api-Key,x-api-key,X-Org-Id,x-org-id'"'"'",
              "method.response.header.Access-Control-Allow-Methods": "'"'"'GET,OPTIONS'"'"'",
              "method.response.header.Access-Control-Allow-Origin": "'"'"'*'"'"'"
            }' \
            --region $REGION

          echo "=== 5. Add method response to GET ==="
          aws apigateway put-method-response \
            --rest-api-id $API --resource-id $RES \
            --http-method GET --status-code 200 \
            --response-parameters '{
              "method.response.header.Access-Control-Allow-Origin": false
            }' \
            --region $REGION 2>&1 || echo "GET method response already exists"

          echo "=== 6. Add integration response to GET ==="
          aws apigateway put-integration-response \
            --rest-api-id $API --resource-id $RES \
            --http-method GET --status-code 200 \
            --response-parameters '{
              "method.response.header.Access-Control-Allow-Origin": "'"'"'*'"'"'"
            }' \
            --region $REGION 2>&1 || echo "GET integration response already exists"

          echo "=== 7. Deploy ==="
          aws apigateway create-deployment --rest-api-id $API --stage-name $STAGE --region $REGION
          echo "Done."
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
