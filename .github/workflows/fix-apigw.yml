name: Fix API Gateway Deploy

on:
  workflow_dispatch:

jobs:
  fix-apigw:
    runs-on: ubuntu-latest
    steps:
      - name: Wire OPTIONS CORS + deploy
        run: |
          API=1h4kpspbs6
          RES=uivykb
          REGION=us-east-1
          STAGE=prod

          echo "=== 4. Integration response (via file) ==="
          cat > /tmp/integ_resp.json << 'JSONEOF'
{
  "method.response.header.Access-Control-Allow-Headers": "'Content-Type,Authorization,X-Api-Key,x-api-key,X-Org-Id,x-org-id'",
  "method.response.header.Access-Control-Allow-Methods": "'GET,OPTIONS'",
  "method.response.header.Access-Control-Allow-Origin": "'*'"
}
JSONEOF
          aws apigateway put-integration-response \
            --rest-api-id $API --resource-id $RES \
            --http-method OPTIONS --status-code 200 \
            --response-parameters file:///tmp/integ_resp.json \
            --region $REGION

          echo "=== 5. Deploy ==="
          aws apigateway create-deployment --rest-api-id $API --stage-name $STAGE --region $REGION
          echo "Done."
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
