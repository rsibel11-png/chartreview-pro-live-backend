name: Fix API Gateway Deploy

on:
  workflow_dispatch:

jobs:
  fix-apigw:
    runs-on: ubuntu-latest
    steps:
      - name: Create DynamoDB table + wire CORS + deploy
        run: |
          REGION=us-east-1
          API_ID=1h4kpspbs6
          STAGE=prod
          PII_RESOURCE=uivykb

          echo "=== 1. Create DynamoDB table if missing ==="
          aws dynamodb describe-table --table-name chartreview-folder-pii-prod --region $REGION 2>/dev/null || \
          aws dynamodb create-table \
            --table-name chartreview-folder-pii-prod \
            --attribute-definitions AttributeName=folder_key,AttributeType=S \
            --key-schema AttributeName=folder_key,KeyType=HASH \
            --billing-mode PAY_PER_REQUEST \
            --region $REGION
          echo "Table ready."

          echo "=== 2. Wire OPTIONS MOCK with correct CORS headers ==="
          aws apigateway put-integration \
            --rest-api-id $API_ID --resource-id $PII_RESOURCE \
            --http-method OPTIONS --type MOCK \
            --region $REGION 2>/dev/null || true

          aws apigateway put-integration-response \
            --rest-api-id $API_ID --resource-id $PII_RESOURCE \
            --http-method OPTIONS --status-code 200 \
            --response-parameters '{
              "method.response.header.Access-Control-Allow-Headers": "'"'"'Content-Type,Authorization,x-api-key,x-org-id'"'"'",
              "method.response.header.Access-Control-Allow-Methods": "'"'"'GET,OPTIONS'"'"'",
              "method.response.header.Access-Control-Allow-Origin": "'"'"'*'"'"'"
            }' \
            --region $REGION 2>/dev/null || true

          echo "=== 3. Deploy ==="
          aws apigateway create-deployment --rest-api-id $API_ID --stage-name $STAGE --region $REGION
          echo "Done."
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
