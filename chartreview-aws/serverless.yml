service: chartreview-pro

frameworkVersion: '3'

plugins:
  - serverless-plugin-scripts

custom:
  scripts:
    hooks:
      'after:deploy:finalize': bash scripts/patch-cors.sh


provider:
  name: aws
  description: 'ChartReview Pro API v2 - cors-fix-7'
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'prod'}
  apiGateway:
    minimumCompressionSize: 1024
    cors:
      origin: '*'
      headers:
        - Content-Type
        - X-Amz-Date
        - Authorization
        - X-Api-Version
        - x-api-key
        - X-Api-Key
        - x-org-id
        - X-Org-Id
        - X-Amz-Security-Token
      allowCredentials: false
      maxAge: 86400
  environment:
    PATIENTS_TABLE: ${self:service}-patients-${self:provider.stage}
    DOCUMENTS_TABLE: ${self:service}-documents-${self:provider.stage}
    SUMMARIES_TABLE: ${self:service}-summaries-${self:provider.stage}
    S3_BUCKET: ${self:service}-files-${self:provider.stage}
    API_KEY: "ChartReview#2026$ProdKey!Rx"
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-patients-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-documents-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-summaries-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-documents-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-summaries-${self:provider.stage}/index/*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource: arn:aws:s3:::${self:service}-files-${self:provider.stage}/*
        - Effect: Allow
          Action:
            - textract:DetectDocumentText
            - textract:StartDocumentTextDetection
            - textract:GetDocumentTextDetection
          Resource: "*"
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource: "arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"

functions:
  debugPatients:
    handler: src/handlers/patients.debug
    events:
      - http:
          path: /patients/debug
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  # ── PATIENTS ──
  listPatients:
    handler: src/handlers/patients.list
    events:
      - http:
          path: /patients
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  createPatient:
    handler: src/handlers/patients.create
    events:
      - http:
          path: /patients
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  getPatient:
    handler: src/handlers/patients.get
    events:
      - http:
          path: /patients/{aws_patient_id}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  updatePatient:
    handler: src/handlers/patients.update
    events:
      - http:
          path: /patients/{aws_patient_id}
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  deletePatient:
    handler: src/handlers/patients.remove
    events:
      - http:
          path: /patients/{aws_patient_id}
          method: delete
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  # ── DOCUMENTS ──
  getUploadUrl:
    handler: src/handlers/documents.getUploadUrl
    events:
      - http:
          path: /documents/upload-url
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  getDocument:
    handler: src/handlers/documents.get
    events:
      - http:
          path: /documents/{aws_document_id}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  deleteDocument:
    handler: src/handlers/documents.remove
    events:
      - http:
          path: /documents/{aws_document_id}
          method: delete
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  getDownloadUrl:
    handler: src/handlers/documents.getDownloadUrl
    events:
      - http:
          path: /documents/{aws_document_id}/download-url
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  processDocument:
    handler: src/handlers/documents.process
    timeout: 60
    events:
      - http:
          path: /documents/{aws_document_id}/process
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  listPatientDocuments:
    handler: src/handlers/documents.listByPatient
    events:
      - http:
          path: /patients/{aws_patient_id}/documents
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  # ── SUMMARIES ──
  createSummary:
    handler: src/handlers/summaries.create
    events:
      - http:
          path: /summaries
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  getSummary:
    handler: src/handlers/summaries.get
    events:
      - http:
          path: /summaries/{aws_summary_id}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  updateSummary:
    handler: src/handlers/summaries.update
    events:
      - http:
          path: /summaries/{aws_summary_id}
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  deleteSummary:
    handler: src/handlers/summaries.remove
    events:
      - http:
          path: /summaries/{aws_summary_id}
          method: delete
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

resources:
  Resources:
    GatewayResponseDefault4XX:
      Type: 'AWS::ApiGateway::GatewayResponse'
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,x-api-key,X-Org-Id,x-org-id,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE,PATCH'"
        ResponseType: DEFAULT_4XX
        RestApiId: !Ref ApiGatewayRestApi

    GatewayResponseDefault5XX:
      Type: 'AWS::ApiGateway::GatewayResponse'
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,x-api-key,X-Org-Id,x-org-id,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE,PATCH'"
        ResponseType: DEFAULT_5XX
        RestApiId: !Ref ApiGatewayRestApi
