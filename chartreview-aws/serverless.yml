                  - Authorization
                  - X-Api-Version
                  - x-api-key
                  - X-Api-Key
                  - x-org-id
                  - X-Org-Id
                  - X-Amz-Security-Token
                allowCredentials: false
      - http:
          path: /summaries/{proxy+}
          method: options
              cors:
                origin: '*'
                headers:
                  - Content-Type
                  - X-Amz-Date
                  - Authorization
                  - X-Api-Version
                  - x-api-key
                  - X-Api-Key
                  - x-org-id
                  - X-Org-Id
                  - X-Amz-Security-Token
