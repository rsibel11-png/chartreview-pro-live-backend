service: chartreview-pro

frameworkVersion: '3'

provider:
  name: aws
  description: 'ChartReview Pro API v3 - documents_new wired'
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'prod'}
  apiGateway:
    minimumCompressionSize: 1024
  environment:
    PATIENTS_TABLE: ${self:service}-patients-${self:provider.stage}
    DOCUMENTS_TABLE: ${self:service}-documents-${self:provider.stage}
    SUMMARIES_TABLE: ${self:service}-summaries-${self:provider.stage}
    S3_BUCKET: chartreview-pro-files-${self:provider.stage}
    API_KEY: "ChartReview#2026$ProdKey!Rx"
    WORKER_FUNCTION_NAME: ${self:service}-${self:provider.stage}-processWorker
    AWS_ACCOUNT_ID: !Ref AWS::AccountId
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-patients-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-documents-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-summaries-${self:provider.stage}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-documents-${self:provider.stage}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:service}-summaries-${self:provider.stage}/index/*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::chartreview-pro-files-${self:provider.stage}/*
            - arn:aws:s3:::chartreview-pro-files-${self:provider.stage}
        - Effect: Allow
          Action:
            - textract:DetectDocumentText
            - textract:StartDocumentTextDetection
            - textract:GetDocumentTextDetection
          Resource: "*"
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
          Resource:
            - "arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-haiku-20240307-v1:0"
            - "arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-5-haiku-20241022-v1:0"
            - "arn:aws:bedrock:us-east-1::foundation-model/anthropic.claude-3-5-sonnet-20241022-v2:0"
            - "arn:aws:bedrock:us-east-1::foundation-model/us.anthropic.claude-3-5-haiku-20241022-v1:0"
            - "arn:aws:bedrock:us-east-1::foundation-model/us.anthropic.claude-3-5-sonnet-20241022-v2:0"
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource: "*"
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource: "*"

functions:
  # ── PATIENTS ──
  listPatients:
    handler: src/handlers/patients.list
    events:
      - http:
          path: /patients
          method: get
          cors: true

  createPatient:
    handler: src/handlers/patients.create
    events:
      - http:
          path: /patients
          method: post
          cors: true

  getPatient:
    handler: src/handlers/patients.get
    events:
      - http:
          path: /patients/{aws_patient_id}
          method: get
          cors: true

  updatePatient:
    handler: src/handlers/patients.update
    events:
      - http:
          path: /patients/{aws_patient_id}
          method: put
          cors: true

  deletePatient:
    handler: src/handlers/patients.remove
    events:
      - http:
          path: /patients/{aws_patient_id}
          method: delete
          cors: true

  listPatientDocuments:
    handler: src/handlers/documents_new.listByPatient
    events:
      - http:
          path: /patients/{aws_patient_id}/documents
          method: get
          cors: true

  # ── DOCUMENTS ──
  getUploadUrl:
    handler: src/handlers/documents_new.getUploadUrl
    timeout: 30
    events:
      - http:
          path: /documents/upload-url
          method: post
          cors: true

  directUpload:
    handler: src/handlers/documents_new.directUpload
    timeout: 30
    events:
      - http:
          path: /documents/direct-upload
          method: post
          cors: true

  listAllDocuments:
    handler: src/handlers/documents_new.listAll
    timeout: 30
    events:
      - http:
          path: /documents
          method: get
          cors: true

  getDocument:
    handler: src/handlers/documents_new.get
    timeout: 30
    events:
      - http:
          path: /documents/{aws_document_id}
          method: get
          cors: true

  updateDocument:
    handler: src/handlers/documents_new.update
    timeout: 30
    events:
      - http:
          path: /documents/{aws_document_id}
          method: put
          cors: true

  deleteDocument:
    handler: src/handlers/documents_new.remove
    timeout: 30
    events:
      - http:
          path: /documents/{aws_document_id}
          method: delete
          cors: true

  getDownloadUrl:
    handler: src/handlers/documents_new.getDownloadUrl
    timeout: 30
    events:
      - http:
          path: /documents/{aws_document_id}/download-url
          method: get
          cors: true

  getDocumentText:
    handler: src/handlers/documents_new.getText
    timeout: 30
    events:
      - http:
          path: /documents/{aws_document_id}/text
          method: get
          cors: true

  getDocumentFullText:
    handler: src/handlers/documents_new.getFullText
    timeout: 30
    events:
      - http:
          path: /documents/{aws_document_id}/full-text
          method: get
          cors: true

  processDocument:
    handler: src/handlers/documents_new.process
    timeout: 30
    events:
      - http:
          path: /documents/{aws_document_id}/process
          method: post
          cors: true

  processWorker:
    handler: src/handlers/documents_new.worker
    timeout: 900
    memorySize: 1024

  assessRelevance:
    handler: src/handlers/documents_new.assessRelevance
    timeout: 300
    memorySize: 512
    events:
      - http:
          path: /documents/{aws_document_id}/assess-relevance
          method: post
          cors: true

  reassessDocument:
    handler: src/handlers/documents_new.reassessDocument
    timeout: 300
    memorySize: 512
    events:
      - http:
          path: /documents/{aws_document_id}/reassess
          method: post
          cors: true

  classifyStart:
    handler: src/handlers/documents_new.classifyStart
    timeout: 30
    events:
      - http:
          path: /documents/{aws_document_id}/classify
          method: post
          cors: true


  getJob:
    handler: src/handlers/documents_new.getJob
    timeout: 30
    events:
      - http:
          path: /jobs/{job_id}
          method: get
          cors: true

  # ── SUMMARIES ──
  listAllSummaries:
    handler: src/handlers/summaries.listAll
    events:
      - http:
          path: /summaries
          method: get
          cors: true

  createSummary:
    handler: src/handlers/summaries.create
    events:
      - http:
          path: /summaries
          method: post
          cors: true

  getSummary:
    handler: src/handlers/summaries.get
    events:
      - http:
          path: /summaries/{aws_summary_id}
          method: get
          cors: true

  updateSummary:
    handler: src/handlers/summaries.update
    events:
      - http:
          path: /summaries/{aws_summary_id}
          method: put
          cors: true

  deleteSummary:
    handler: src/handlers/summaries.remove
    events:
      - http:
          path: /summaries/{aws_summary_id}
          method: delete
          cors: true

resources:
  Resources:
    GatewayResponseDefault4XX:
      Type: 'AWS::ApiGateway::GatewayResponse'
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,x-api-key,X-Org-Id,x-org-id,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE'"
        ResponseType: DEFAULT_4XX
        RestApiId: !Ref ApiGatewayRestApi

    GatewayResponseDefault5XX:
      Type: 'AWS::ApiGateway::GatewayResponse'
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,x-api-key,X-Org-Id,x-org-id,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'OPTIONS,GET,POST,PUT,DELETE'"
        ResponseType: DEFAULT_5XX
        RestApiId: !Ref ApiGatewayRestApi
