              - X-Amz-Date
              - Authorization
              - X-Api-Version
              - x-api-key
              - X-Api-Key
              - x-org-id
              - X-Org-Id
            allowCredentials: false

  # ── CORS PREFLIGHT ──
  corsDocuments:
    handler: src/handlers/documents_new.options
    events:
      - http:
          path: /documents
          method: options
              cors:
                origin: '*'
                headers:
                  - Content-Type
                  - X-Amz-Date
                  - Authorization
                  - X-Api-Version
                  - x-api-key
                  - X-Api-Key
                  - x-org-id
                  - X-Org-Id
                  - X-Amz-Security-Token
                allowCredentials: false
      - http:
          path: /documents/{proxy+}
          method: options
              cors:
                origin: '*'
                headers:
                  - Content-Type
                  - X-Amz-Date
                  - Authorization
                  - X-Api-Version
                  - x-api-key
                  - X-Api-Key
                  - x-org-id
                  - X-Org-Id
                  - X-Amz-Security-Token
                allowCredentials: false
  corsPatients:
    handler: src/handlers/documents_new.options
