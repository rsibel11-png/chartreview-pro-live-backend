service: chartreview-pro

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: prod
  deploymentPrefix: crp-deploy-v2
  timeout: 29
  environment:
    DOCUMENTS_TABLE: chartreview-documents-prod
    PATIENTS_TABLE: chartreview-patients-prod
    SUMMARIES_TABLE: chartreview-summaries-prod
    DOCUMENTS_BUCKET: chartreview-documents-prod
    API_KEY: ChartReview#2026$ProdKey!Rx
    WORKER_FUNCTION_NAME: chartreview-pro-prod-processWorker
    PROCESSING_QUEUE_URL: !Ref ProcessingQueue
    CLASSIFY_QUEUE_URL: !Ref ClassifyJobQueue
    CLASSIFY_WORKER_FUNCTION_NAME: chartreview-pro-prod-classifyJobWorker
    JOBS_TABLE: chartreview-jobs-prod
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:us-east-1:*:table/chartreview-documents-prod
            - arn:aws:dynamodb:us-east-1:*:table/chartreview-documents-prod/index/*
            - arn:aws:dynamodb:us-east-1:*:table/chartreview-patients-prod
            - arn:aws:dynamodb:us-east-1:*:table/chartreview-patients-prod/index/*
            - arn:aws:dynamodb:us-east-1:*:table/chartreview-summaries-prod
            - arn:aws:dynamodb:us-east-1:*:table/chartreview-summaries-prod/index/*
            - arn:aws:dynamodb:us-east-1:*:table/chartreview-jobs-prod
            - arn:aws:dynamodb:us-east-1:*:table/chartreview-jobs-prod/index/*
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:GetObjectAcl
          Resource: arn:aws:s3:::chartreview-documents-prod/*
        - Effect: Allow
          Action:
            - textract:StartDocumentTextDetection
            - textract:GetDocumentTextDetection
            - textract:DetectDocumentText
          Resource: '*'
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
          Resource: '*'
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:us-east-1:*:function:chartreview-pro-prod-processWorker
            - arn:aws:lambda:us-east-1:*:function:chartreview-pro-prod-classifyJobWorker
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:GetQueueUrl
          Resource:
            - !GetAtt ProcessingQueue.Arn
            - !GetAtt ProcessingDLQ.Arn
            - !GetAtt ClassifyJobQueue.Arn
            - !GetAtt ClassifyJobDLQ.Arn

