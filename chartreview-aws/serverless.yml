resources:
  Resources:

    ProcessingQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: chartreview-processing-queue
        VisibilityTimeout: 360
        MessageRetentionPeriod: 86400
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ProcessingDLQ.Arn
          maxReceiveCount: 2

    ProcessingDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: chartreview-processing-dlq
        VisibilityTimeout: 120
        MessageRetentionPeriod: 1209600

    ClassifyJobQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: chartreview-classify-queue
        VisibilityTimeout: 720
        MessageRetentionPeriod: 86400
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ClassifyJobDLQ.Arn
          maxReceiveCount: 2

    ClassifyJobDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: chartreview-classify-dlq
        VisibilityTimeout: 120
        MessageRetentionPeriod: 1209600

    JobsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: chartreview-jobs-prod
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: job_id
            AttributeType: S
          - AttributeName: org_id
            AttributeType: S
          - AttributeName: created_at
            AttributeType: S
        KeySchema:
          - AttributeName: job_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: org_id-created_at-index
            KeySchema:
              - AttributeName: org_id
                KeyType: HASH
              - AttributeName: created_at
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

    DocumentsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: chartreview-documents-prod
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: aws_document_id
            AttributeType: S
          - AttributeName: org_id
            AttributeType: S
          - AttributeName: created_at
            AttributeType: S
        KeySchema:
          - AttributeName: aws_document_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: org_id-created_at-index
            KeySchema:
              - AttributeName: org_id
                KeyType: HASH
              - AttributeName: created_at
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    PatientsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: chartreview-patients-prod
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: aws_patient_id
            AttributeType: S
          - AttributeName: org_id
            AttributeType: S
          - AttributeName: created_at
            AttributeType: S
        KeySchema:
          - AttributeName: aws_patient_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: org_id-created_at-index
            KeySchema:
              - AttributeName: org_id
                KeyType: HASH
              - AttributeName: created_at
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    SummariesTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: chartreview-summaries-prod
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: aws_summary_id
            AttributeType: S
          - AttributeName: org_id
            AttributeType: S
          - AttributeName: created_at
            AttributeType: S
        KeySchema:
          - AttributeName: aws_summary_id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: org_id-created_at-index
            KeySchema:
              - AttributeName: org_id
                KeyType: HASH
              - AttributeName: created_at
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    DocumentsBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      Properties:
        BucketName: chartreview-documents-prod
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ['*']
              AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
              AllowedOrigins: ['*']
              MaxAge: 3000

