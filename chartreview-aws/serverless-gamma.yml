service: chartreview-gamma

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs18.x
  region: us-east-1
  stage: prod
  deploymentPrefix: crp-gamma-deploy
  timeout: 29
  environment:
    DOCUMENTS_TABLE: chartreview-documents-prod
    PATIENTS_TABLE: chartreview-patients-prod
    SUMMARIES_TABLE: chartreview-summaries-prod
    DOCUMENTS_BUCKET: chartreview-documents-prod
    API_KEY: ChartReview#2026$ProdKey!Rx
    JOBS_TABLE: chartreview-jobs-prod
    CLASSIFY_QUEUE_URL: !Ref ClassifyJobQueue
    CLASSIFY_WORKER_FUNCTION_NAME: chartreview-gamma-prod-classifyJobWorker
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - arn:aws:dynamodb:us-east-1:*:table/chartreview-documents-prod
            - arn:aws:dynamodb:us-east-1:*:table/chartreview-documents-prod/index/*
            - arn:aws:dynamodb:us-east-1:*:table/chartreview-jobs-prod
            - arn:aws:dynamodb:us-east-1:*:table/chartreview-jobs-prod/index/*
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
          Resource: arn:aws:s3:::chartreview-documents-prod/*
        - Effect: Allow
          Action:
            - bedrock:InvokeModel
            - bedrock:InvokeModelWithResponseStream
          Resource: '*'
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:us-east-1:*:function:chartreview-gamma-prod-classifyJobWorker
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:GetQueueUrl
          Resource:
            - !GetAtt ClassifyJobQueue.Arn
            - !GetAtt ClassifyJobDLQ.Arn

functions:

  classifyStart:
    handler: src/handlers/documents_new.classifyStart
    timeout: 29
    events:
      - http:
          path: documents/{aws_document_id}/classify/start
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - x-api-key
              - x-org-id
            allowCredentials: false

  classifyJobWorker:
    handler: src/handlers/documents_new.classifyWorker
    timeout: 600
    events:
      - sqs:
          arn: !GetAtt ClassifyJobQueue.Arn
          batchSize: 1

  getJob:
    handler: src/handlers/documents_new.getJob
    timeout: 29
    events:
      - http:
          path: jobs/{job_id}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - x-api-key
              - x-org-id
            allowCredentials: false

resources:
  Resources:

    ClassifyJobQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: chartreview-classify-queue
        VisibilityTimeout: 720
        MessageRetentionPeriod: 86400
        RedrivePolicy:
          deadLetterTargetArn: !GetAtt ClassifyJobDLQ.Arn
          maxReceiveCount: 2

    ClassifyJobDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: chartreview-classify-dlq
        VisibilityTimeout: 120
        MessageRetentionPeriod: 1209600

    JobsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: chartreview-jobs-prod
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: job_id
            AttributeType: S
        KeySchema:
          - AttributeName: job_id
            KeyType: HASH
        TimeToLiveSpecification:
          AttributeName: ttl
          Enabled: true

  Outputs:
    ClassifyJobQueueUrl:
      Value: !Ref ClassifyJobQueue
      Export:
        Name: chartreview-gamma-prod-ClassifyJobQueueUrl
    ClassifyJobQueueArn:
      Value: !GetAtt ClassifyJobQueue.Arn
      Export:
        Name: chartreview-gamma-prod-ClassifyJobQueueArn
